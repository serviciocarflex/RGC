<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal RGC | Carflex</title>

<style>
:root {
    --primary: #ff7225;
    --primary-dark: #e65a15;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f3f4f6;
    padding: 20px;
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('fondo formulario.jpg') center/cover no-repeat;
    filter: brightness(.55) blur(4px);
    z-index: -1;
}

.card {
    width: 100%;
    max-width: 900px;
    background: rgba(255,255,255,.98);
    border-radius: 22px;
    padding: 32px;
    box-shadow: 0 25px 50px rgba(0,0,0,.25);
}

.header {
    text-align: center;
    margin-bottom: 24px;
}

.logo {
    width: 145px;
    margin-bottom: 12px;
}

h2 {
    color: var(--text);
    font-size: 26px;
    margin-bottom: 6px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 24px;
}

.input-group span {
    display: block;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
}

input, select {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 2px solid var(--border);
    font-size: 15px;
    outline: none;
    background: white;
}

input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(255,114,37,.1);
}

.file-section {
    grid-column: 1 / 3;
    padding: 18px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    background: #fafafa;
}

.file-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.file-box {
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: white;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.file-box:hover {
    border-color: var(--primary);
    background: #fff7ed;
}

.file-box input {
    display: none;
}

.file-box label {
    cursor: pointer;
    display: block;
    font-size: 13px;
    color: var(--text);
}

.file-name {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    word-break: break-word;
}

.file-help {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
}

button {
    grid-column: 1 / 3;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

button:hover { background: var(--primary-dark); }
button:disabled { opacity: .6; cursor: not-allowed; }

.msg {
    grid-column: 1 / 3;
    margin-top: 4px;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
}

.error {
    background: #fef2f2;
    color: #b91c1c;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #fee2e2;
}

.success {
    background: #f0fdf4;
    color: #166534;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #dcfce7;
}

@media (max-width: 760px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .file-section,
    button,
    .msg {
        grid-column: 1;
    }

    .file-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="header">
        <img src="Logo carflex.jpg" class="logo" alt="Carflex">
        <h2>Portal RGC</h2>
        <p class="subtitle">Solicitud automática de informe de daños RGC</p>
    </div>

    <form id="form" class="form-grid">

        <div class="input-group">
            <span>N° OT</span>
            <input id="ot" type="text" placeholder="Ej: 32249" required autocomplete="off">
        </div>

        <div class="input-group">
            <span>Solicitante</span>
            <select id="solicitante" required>
                <option value="">Seleccione solicitante</option>
                <option value="Marco">Marco</option>
                <option value="Johan">Johan</option>
                <option value="Daniel">Daniel</option>
            </select>
        </div>

        <div class="input-group">
            <span>Tipo de contrato</span>
            <input id="tipoContrato" type="text" placeholder="Ej: Rent a Car / Leasing / Flota" required>
        </div>

        <div class="input-group">
            <span>N° contrato</span>
            <input id="numeroContrato" type="text" placeholder="Ej: 123456" required>
        </div>

        <div class="input-group">
            <span>Cliente</span>
            <input id="cliente" type="text" placeholder="Nombre del cliente" required>
        </div>

        <div class="input-group">
            <span>Correo solicitante</span>
            <input id="correoVisible" type="text" placeholder="Se completa automáticamente" disabled>
        </div>

        <div class="file-section">
            <div class="input-group">
                <span>Fotografías del daño</span>

                <div class="file-grid">

                    <div class="file-box">
                        <label for="imagen1">Imagen 1</label>
                        <input id="imagen1" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                        <div class="file-name" id="name1">Sin archivo</div>
                    </div>

                    <div class="file-box">
                        <label for="imagen2">Imagen 2</label>
                        <input id="imagen2" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                        <div class="file-name" id="name2">Sin archivo</div>
                    </div>

                    <div class="file-box">
                        <label for="imagen3">Imagen 3</label>
                        <input id="imagen3" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                        <div class="file-name" id="name3">Sin archivo</div>
                    </div>

                    <div class="file-box">
                        <label for="imagen4">Imagen 4</label>
                        <input id="imagen4" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                        <div class="file-name" id="name4">Sin archivo</div>
                    </div>

                    <div class="file-box">
                        <label for="imagen5">Imagen 5</label>
                        <input id="imagen5" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                        <div class="file-name" id="name5">Sin archivo</div>
                    </div>

                </div>

                <p class="file-help">
                    Puede adjuntar hasta 5 imágenes en formato JPG o PNG. No son obligatorias.
                </p>
            </div>
        </div>

        <button type="submit" id="btn-submit">
            Generar informe RGC
        </button>

        <div id="msg" class="msg"></div>

    </form>

</div>

<script>
const WEBHOOK_URL = "https://shale-alarm-prodigy.ngrok-free.dev/webhook-test/rgc";

const correosSolicitantes = {
    "Marco": "marco@carflex.cl",
    "Johan": "johan@carflex.cl",
    "Daniel": "daniel@carflex.cl"
};

document.getElementById("solicitante").addEventListener("change", e => {
    const solicitante = e.target.value;
    document.getElementById("correoVisible").value = correosSolicitantes[solicitante] || "";
});

for (let i = 1; i <= 5; i++) {
    document.getElementById("imagen" + i).addEventListener("change", e => {
        const archivo = e.target.files[0];
        document.getElementById("name" + i).textContent = archivo ? archivo.name : "Sin archivo";
    });
}

document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();

    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn-submit");

    const ot = document.getElementById("ot").value.trim();
    const solicitante = document.getElementById("solicitante").value;
    const correo = correosSolicitantes[solicitante];

    const tipoContrato = document.getElementById("tipoContrato").value.trim();
    const numeroContrato = document.getElementById("numeroContrato").value.trim();
    const cliente = document.getElementById("cliente").value.trim();

    const imagenes = [
        document.getElementById("imagen1").files[0],
        document.getElementById("imagen2").files[0],
        document.getElementById("imagen3").files[0],
        document.getElementById("imagen4").files[0],
        document.getElementById("imagen5").files[0]
    ].filter(Boolean);

    if (!ot || !solicitante || !tipoContrato || !numeroContrato || !cliente) {
        msg.className = "msg error";
        msg.innerHTML = "Debe completar todos los campos obligatorios.";
        return;
    }

    for (const img of imagenes) {
        if (img.type !== "image/jpeg" && img.type !== "image/png") {
            msg.className = "msg error";
            msg.innerHTML = "Solo se permiten imágenes JPG o PNG.";
            return;
        }
    }

    const formData = new FormData();

    formData.append("ot", ot);
    formData.append("solicitante", solicitante);
    formData.append("correo", correo);
    formData.append("tipoContrato", tipoContrato);
    formData.append("numeroContrato", numeroContrato);
    formData.append("cliente", cliente);

    imagenes.forEach((img, index) => {
        formData.append("imagen" + (index + 1), img);
    });

    msg.className = "msg";
    msg.innerHTML = "Enviando solicitud...";
    btn.disabled = true;

    try {
        const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            body: formData
        });

        if (!response.ok) throw new Error();

        msg.className = "msg success";
        msg.innerHTML = "Solicitud enviada correctamente.";
        document.getElementById("form").reset();

        for (let i = 1; i <= 5; i++) {
            document.getElementById("name" + i).textContent = "Sin archivo";
        }

        document.getElementById("correoVisible").value = "";

    } catch (err) {
        msg.className = "msg error";
        msg.innerHTML = "Error de conexión. Intente nuevamente.";
    }

    btn.disabled = false;
});
</script>

</body>
</html>
